<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gage's Wish List</title><style id="css">:root {
  /* Retail product-listing layout: dark top bar, light gray sub bar, sidebar of categories, clean card grid. */
  --bar: #1b2430;
  --bar-2: #26313f;
  --sub: #eef0f2;
  --text: #0f1111;
  --gray: #565959;
  --line: #d5d9d9;
  --accent: #f7c948;
  --accent-edge: #e0b02f;
  --accent-2: #f39c35;
  --link: #0a6c86;
  --font: Arial, Helvetica, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #ffffff; color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }

.top { background: var(--bar); color: #fff; }
.top-in { display: flex; align-items: center; gap: 16px; padding: 10px 16px; max-width: 1400px; margin: 0 auto; }
.brand { font-size: 20px; font-weight: 700; white-space: nowrap; letter-spacing: -.2px; }
.search { flex: 1; display: flex; min-width: 0; }
.search input { flex: 1; min-width: 0; border: 0; border-radius: 4px 0 0 4px; padding: 9px 10px; background: #fff; color: var(--text); }
.search input:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 0; }
.search span { background: var(--accent-2); color: var(--text); border-radius: 0 4px 4px 0; padding: 9px 12px; font-weight: 700; }
.top .btn-add { white-space: nowrap; }

.sub { background: var(--sub); border-bottom: 1px solid var(--line); }
.sub-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; max-width: 1400px; margin: 0 auto; }
.sub label { color: var(--gray); font-size: 13px; }
.sub select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-weight: 700; }
.linkbtn { background: none; border: 0; padding: 4px 2px; color: var(--link); cursor: pointer; font-size: 13px; }
.linkbtn:hover { text-decoration: underline; color: #c45500; }
.linkbtn:focus-visible { outline: 2px solid var(--link); border-radius: 2px; }
.status { margin-left: auto; color: var(--gray); font-size: 12px; }

.wrap { display: grid; grid-template-columns: 220px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 16px; }
aside h2 { font-size: 15px; margin: 0 0 8px; }
.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cats button { width: 100%; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
.cats button:hover { color: #c45500; }
.cats button[aria-pressed="true"] { font-weight: 700; background: var(--sub); }
.cats button:focus-visible { outline: 2px solid var(--link); }
.cats .n { color: var(--gray); font-variant-numeric: tabular-nums; }
.side-note { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--gray); font-size: 12px; }

.bar2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.count { font-size: 14px; }
.count b { font-weight: 700; }
.ctrl { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.ctrl select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sub); box-shadow: 0 1px 2px rgba(15,17,17,.12); }
.ctrl select:focus-visible, .ctrl input:focus-visible { outline: 2px solid var(--link); }
.mob-cat { display: none; }
.openall { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.openall small { color: var(--gray); font-size: 12px; }

.group-h { font-size: 18px; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.group-h:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 6px; background: #fff; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .15s; }
.card:hover { box-shadow: 0 2px 10px rgba(15,17,17,.13); }
.pic { aspect-ratio: 1 / 1; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #eee; padding: 12px; }
.pic { position: relative; }
.pic[data-pic] { cursor: pointer; }
.pic[data-pic]:focus-visible { outline: 3px solid var(--link); outline-offset: -3px; }
.pic.over { background: #fff8e1; }
.pichint { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-size: 12px; color: var(--link); text-align: center; opacity: 0; transition: opacity .15s; }
.pic[data-pic]:hover .pichint, .pic[data-pic]:focus-visible .pichint, .pic[data-pic] .ph + .pichint { opacity: 1; }
.pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ph { width: 100%; height: 100%; background: #e9ebec; color: var(--gray); display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; font-size: 13px; border-radius: 3px; }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.name { font-size: 15px; color: var(--text); text-decoration: none; line-height: 1.3; }
.name:hover { color: #c45500; text-decoration: underline; }
.meta { color: var(--gray); font-size: 12px; }
.price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { color: var(--gray); font-size: 13px; }
.more { color: #007600; font-size: 12px; }
.actions { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 12px; }

.btn { display: inline-block; text-align: center; text-decoration: none; cursor: pointer; border-radius: 20px; padding: 7px 14px; border: 1px solid var(--line); background: #fff; color: var(--text); font-size: 13px; }
.btn:hover { background: #f7f8f8; }
.btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent-edge); }
.btn.primary:hover { background: #f0be32; }
.btn.secondary { background: var(--accent-2); border-color: #d9852a; }
.btn.secondary:hover { background: #ea8f27; }
.empty { padding: 40px 0; color: var(--gray); }

.modal-bg { position: fixed; inset: 0; background: rgba(15,17,17,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 20; }
.modal { background: #fff; border-radius: 8px; width: 100%; max-width: 520px; border: 1px solid var(--line); }
.modal h2 { font-size: 18px; margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--sub); border-radius: 8px 8px 0 0; }
.modal form, .modal .mbody { padding: 16px 18px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 13px; }
.field input, .field select, .field textarea { border: 1px solid #a6a6a6; border-radius: 4px; padding: 7px 9px; background: #fff; }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { outline: 2px solid var(--link); border-color: var(--link); }
.field small { color: var(--gray); font-size: 12px; }
.check { display: flex; align-items: center; gap: 8px; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
.err { color: #b12704; font-size: 12px; }

@media (max-width: 760px) {
  .wrap { grid-template-columns: 1fr; }
  aside { display: none; }
  .mob-cat { display: flex; }
  .top-in { flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; }
  .openall { margin-left: 0; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

.dev { display: none !important; }
body.devmode .dev { display: inline-block !important; }
body.devmode #importbtn[hidden] { display: none !important; }
.top-link { color: #fff; font-size: 13px; }
.top-link:hover { color: var(--accent); }
.btn-cart { background: var(--bar-2); color: #fff; border-color: #3a4656; white-space: nowrap; }
.btn-cart:hover, .btn-cart.on { background: #33404f; color: #fff; }
.btn-cart.on { outline: 2px solid var(--accent); }
#cartn { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--accent-2); color: var(--text); font-weight: 700; }
.btn.added { background: #fff; border-color: #c45500; color: #c45500; }
.btn.added:hover { background: #fff4ec; }

.pricebox { display: flex; align-items: center; gap: 8px; }
.pct { background: #cc0c39; color: #fff; font-weight: 700; font-size: 13px; padding: 3px 6px; border-radius: 3px; }
.price.sale { color: #cc0c39; }
.was { color: var(--gray); font-size: 13px; }
.ends { color: #cc0c39; font-size: 12px; font-weight: 700; }
/* Dark mode */
body.dark { --sub: #1f2630; --text: #e6e8ea; --gray: #a5abb1; --line: #39424d; --link: #5cc3e0; color-scheme: dark; background: #12171d; color: var(--text); }

body.dark .btn:hover { background: #2c3541; }
body.dark .btn.primary, body.dark .btn.secondary { color: #0f1111; }

body.dark .more { color: #6fcf73; }

body.dark .err { color: #ff8a70; }
body.dark .pichint { background: rgba(26,33,41,.95); }
body.dark .pic.over { background: #3a3320; }

  function num(t) { var m = String(t || "").replace(/,/g, "").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
  function showPrice(t) { t = String(t || "").trim(); if (!t) return ""; return /^\d/.test(t) ? "$" + t : t; }
  function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function imgSrc(u) { u = String(u || "").trim(); return /^(https?:\/\/|images\/|\/_blob\/|data:image\/|blob:)/i.test(u) ? u : ""; }

  function status(t) { var el = document.getElementById("status"); if (el) el.textContent = t; }

  function docHTML() {
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>" + esc(TITLE) + "</title><style id=\"css\">" +
      css + "</style></head><body><div id=\"root\"></div><script id=\"state\" type=\"application/json\">" + json +
      "<\/script><script id=\"app\">" + js + "<\/script></body></html>";
  }

  function save() {
    state.savedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (!shared || !art) { status("Changes saved in this browser"); return; }
    status("Saving…");
    clearTimeout(timer);
    timer = setTimeout(function () {
      art.publish(docHTML()).then(function () { status("All changes saved"); }).catch(function (e) {
        var msg = String((e && (e.code || e.message)) || e);
        if (/conflict/i.test(msg)) { status("The list was updated somewhere else. Reloading the latest version."); return; }
        shared = false;
        status("Changes saved in this browser");
      });
    }, 2500);
  }

  function shell() {
    root.innerHTML =
      '<header class="top"><div class="top-in">' +
        '<div class="brand">' + esc(TITLE) + '</div>' +
        '<label class="search" for="q"><input id="q" type="search" placeholder="Search this list" aria-label="Search this list"><span aria-hidden="true">Search</span></label>' +
        '<button class="btn btn-cart" id="cartbtn" type="button" aria-pressed="false">My list <span id="cartn">0</span></button>' +
        '<button class="btn primary btn-add dev" id="add" type="button">New item</button>' +
        '<button class="linkbtn top-link" id="settings" type="button">Settings</button>' +
      '</div></header>' +
      '<div class="sub"><div class="sub-in">' +
        '<label for="listsel">List</label><select id="listsel"></select>' +
        '<button class="linkbtn dev" id="newlist" type="button">New list</button>' +
        '<button class="linkbtn dev" id="renlist" type="button">Rename</button>' +
        '<button class="linkbtn dev" id="dellist" type="button">Delete list</button>' +
        '<button class="linkbtn dev" id="importbtn" type="button" hidden>Import photos</button>' +
        '<button class="linkbtn dev" id="mktop" type="button">Make My list items top picks</button>' +
        '<span class="status" id="status" role="status"></span>' +
      '</div></div>' +
      '<div class="wrap"><aside><h2>Category</h2><ul class="cats" id="cats"></ul>' +
        '<p class="side-note">Thank you for shopping for Gage. "View item" opens the store page in a new tab. "Add item" saves it to My list so you can keep track of what you plan to get.</p></aside>' +
      '<main><div class="bar2">' +
        '<div class="count" id="count"></div>' +
        '<div class="ctrl mob-cat"><label for="catsel">Category</label><select id="catsel"></select></div>' +
        '<div class="ctrl"><label for="sort">Sort by</label><select id="sort">' +
          '<option value="name" selected>Item name: A to Z</option><option value="added">Order added</option><option value="price-asc">Price: low to high</option>' +
          '<option value="price-desc">Price: high to low</option></select></div>' +
        '<label class="ctrl" for="group"><input type="checkbox" id="group" checked> Group by category</label>' +
        '<div class="openall"><button class="btn secondary" id="openall" type="button">Open all links</button>' +
          '<small>Your browser may ask you to allow pop-ups.</small></div>' +
      '</div><div id="items"></div></main></div><div id="modal"></div>';

    document.getElementById("q").addEventListener("input", function (e) { ui.q = e.target.value; render(); });
    document.getElementById("sort").addEventListener("change", function (e) { ui.sort = e.target.value; render(); });
    document.getElementById("group").addEventListener("change", function (e) { ui.group = e.target.checked; render(); });
    document.getElementById("catsel").addEventListener("change", function (e) { ui.cat = e.target.value; render(); });
    document.getElementById("listsel").addEventListener("change", function (e) { ui.list = e.target.value; ui.cat = "all"; render(); });
    document.getElementById("add").addEventListener("click", function () { itemForm(null); });
    document.getElementById("newlist").addEventListener("click", function () { listForm(null); });
    document.getElementById("renlist").addEventListener("click", function () { listForm(cur()); });
    document.getElementById("dellist").addEventListener("click", deleteList);
    document.getElementById("openall").addEventListener("click", openAll);
    document.getElementById("importbtn").addEventListener("click", importPhotos);
    document.getElementById("mktop").addEventListener("click", function () {
      var l = cur(), mine = l.items.filter(function (x) { return inCart(x.id); });
      if (!mine.length) { status('Press "Add item" on the items you want as top picks first.'); return; }
      confirmBox("Make the " + mine.length + " items in My list top picks? My list will be emptied afterwards.", "Make top picks", function () {
        mine.forEach(function (x) { x.top = true; });
        cart = cart.filter(function (id) { return !mine.some(function (x) { return x.id === id; }); }); saveCart(); save(); render();
      });
    });
    document.getElementById("settings").addEventListener("click", settingsBox);
    document.getElementById("cartbtn").addEventListener("click", function () { ui.cartOnly = !ui.cartOnly; render(); });
    document.getElementById("cats").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-cat]"); if (!b) return; ui.cat = b.dataset.cat; render();
    });
    document.getElementById("items").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-act]"); if (!b) return;
      if (b.dataset.act === "cart") {
        var id = b.dataset.id;
        if (inCart(id)) cart = cart.filter(function (x) { return x !== id; }); else cart.push(id);
        saveCart(); render(); return;
      }
      var it = cur().items.find(function (x) { return x.id === b.dataset.id; }); if (!it) return;
      if (b.dataset.act === "edit") itemForm(it); else confirmBox("Remove “" + it.name + "” from this list?", "Remove", function () {
        var l = cur(); l.items = l.items.filter(function (x) { return x.id !== it.id; }); save(); render();
      });
    });
    root.addEventListener("error", function (e) {
      var t = e.target;
      if (t && t.tagName === "IMG" && t.closest(".pic")) { t.parentNode.innerHTML = '<div class="ph">' + esc(t.alt) + "</div>"; }
    }, true);
  }

  function categories(l) {
    var seen = [], counts = {};
    l.items.forEach(function (it) { var c = it.category || "Other"; if (!(c in counts)) { seen.push(c); counts[c] = 0; } counts[c]++; });
    seen.sort(function (a, b) { return a.localeCompare(b); });
    var out = seen.map(function (c) { return { name: c, n: counts[c] }; });
    var nt = l.items.filter(function (x) { return x.top; }).length;
    if (nt) out.unshift({ name: TOP, n: nt });
    return out;
  }

  function visible() {
    var l = cur(), q = ui.q.trim().toLowerCase();
    var arr = l.items.filter(function (it) {
      if (ui.cartOnly && !inCart(it.id)) return false;
      if (ui.cat === TOP) { if (!it.top) return false; }
      else if (ui.cat !== "all" && (it.category || "Other") !== ui.cat) return false;
      if (!q) return true;
      return [it.name, it.category, it.note].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    var by = {
      added: function (a, b) { return a.added - b.added; },
      name: function (a, b) { return a.name.localeCompare(b.name); },
      "price-asc": function (a, b) { var x = num(a.price), y = num(b.price); if (x == null) return 1; if (y == null) return -1; return x - y; },
      "price-desc": function (a, b) { var x = num(a.price), y = num(b.price); if (x == null) return 1; if (y == null) return -1; return y - x; }
    };
    return arr.sort(by[ui.sort]);
  }

  function card(it) {
    var link = safeUrl(it.link), src = imgSrc(it.image);
    var pic = src ? '<img src="' + esc(src) + '" alt="' + esc(it.name) + '" loading="lazy">' : '<div class="ph">' + esc(it.name) + "</div>";
    var drop = assets && dev ? ' data-pic="' + it.id + '" tabindex="0" role="button" aria-label="Add or change the photo for ' + esc(it.name) + '. Paste, drop or press Enter to choose a file."' : "";
    var hint = assets && dev ? '<span class="pichint">' + (src ? "Change photo" : "Paste, drop or click to add a photo") + "</span>" : "";
    var title = link ? '<a class="name" href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(it.name) + "</a>" : '<span class="name">' + esc(it.name) + "</span>";
    return '<article class="card"><div class="pic"' + drop + ">" + pic + hint + '</div><div class="info">' + title +
      '<div class="meta">' + esc(it.category || "Other") + "</div>" +
      (it.was ? '<div class="pricebox"><span class="pct">-' + esc(it.pct) + '%</span> <span class="price sale">' + esc(showPrice(it.price)) + '</span></div><div class="was">List price: <s>' + esc(showPrice(it.was)) + '</s></div><div class="ends">' + (it.ends ? "Sale ends " + esc(it.ends) : "Sale end date not listed") + "</div>"
        : it.price ? '<div class="price">' + esc(showPrice(it.price)) + "</div>" : "") +
      (it.note ? '<div class="note">' + esc(it.note) + "</div>" : "") +
      (it.multi ? '<div class="more">Happy to have more than one</div>' : "") +
      '<div class="actions">' + (link ? '<a class="btn primary" href="' + esc(link) + '" target="_blank" rel="noopener">View item</a>' : "") +
      '<button class="btn ' + (inCart(it.id) ? "added" : "") + '" type="button" data-act="cart" data-id="' + it.id + '" aria-pressed="' + inCart(it.id) + '">' + (inCart(it.id) ? "Remove item" : "Add item") + "</button>" +
      (dev ? '<div class="row"><button class="linkbtn" type="button" data-act="edit" data-id="' + it.id + '">Edit</button>' +
      '<button class="linkbtn" type="button" data-act="del" data-id="' + it.id + '">Delete</button></div>' : "") + "</div></div></article>";
  }

  function render() {
    var l = cur();
    document.body.classList.toggle("devmode", dev);
    var ids = {}; l.items.forEach(function (x) { ids[x.id] = 1; });
    var mine = cart.filter(function (x) { return ids[x]; });
    document.getElementById("cartn").textContent = mine.length;
    var cb = document.getElementById("cartbtn"); cb.setAttribute("aria-pressed", ui.cartOnly); cb.classList.toggle("on", ui.cartOnly);
    document.getElementById("listsel").innerHTML = state.lists.map(function (x) {
      return '<option value="' + x.id + '"' + (x.id === l.id ? " selected" : "") + ">" + esc(x.name) + "</option>";
    }).join("");
    document.getElementById("dellist").style.visibility = state.lists.length < 2 ? "hidden" : "";
    var cats = categories(l);
    if (ui.cat !== "all" && !cats.some(function (c) { return c.name === ui.cat; })) ui.cat = "all";
    document.getElementById("cats").innerHTML = '<li><button type="button" data-cat="all" aria-pressed="' + (ui.cat === "all") + '"><span>All items</span><span class="n">' + l.items.length + "</span></button></li>" +
      cats.map(function (c) { return '<li><button type="button" data-cat="' + esc(c.name) + '" aria-pressed="' + (ui.cat === c.name) + '"><span>' + esc(c.name) + '</span><span class="n">' + c.n + "</span></button></li>"; }).join("");
    document.getElementById("catsel").innerHTML = '<option value="all">All items</option>' + cats.map(function (c) {
      return '<option value="' + esc(c.name) + '"' + (ui.cat === c.name ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("");

    var items = visible();
    if (ui.cartOnly) {
      var lo = 0, hi = 0;
      items.forEach(function (it) { var m = String(it.price || "").replace(/,/g, "").match(/\d+(\.\d+)?/g); if (m) { lo += parseFloat(m[0]); hi += parseFloat(m[m.length - 1]); } });
      var tot = lo ? " \u00b7 Estimated total $" + Math.round(lo) + (hi > lo ? "\u2013$" + Math.round(hi) : "") : "";
      document.getElementById("count").innerHTML = "<b>My list:</b> " + items.length + (items.length === 1 ? " item" : " items") + esc(tot) + ' <button class="linkbtn" type="button" id="backall">Back to all items</button>';
      document.getElementById("backall").onclick = function () { ui.cartOnly = false; render(); };
    } else
    document.getElementById("count").innerHTML = "<b>" + items.length + "</b> " + (items.length === 1 ? "item" : "items") + " in <b>" + esc(l.name) + "</b>";
    var box = document.getElementById("items");
    if (!items.length) { box.innerHTML = '<p class="empty">' + (ui.cartOnly && !mine.length ? 'My list is empty. Press "Add item" on anything you plan to get.' : l.items.length ? "No items match your search." : "This list is empty.") + "</p>"; return; }
    if (ui.group && ui.cat === "all") {
      var order = [], groups = {};
      items.forEach(function (it) { var c = it.category || "Other"; if (!groups[c]) { groups[c] = []; order.push(c); } groups[c].push(it); });
      order.sort(function (a, b) { return a.localeCompare(b); });
      var tops = items.filter(function (it) { return it.top; });
      if (tops.length) { order.unshift(TOP); groups[TOP] = tops; }
      box.innerHTML = order.map(function (c) { return '<h2 class="group-h">' + esc(c) + '</h2><div class="grid">' + groups[c].map(card).join("") + "</div>"; }).join("");
    } else {
      if (ui.cat === "all") items = items.filter(function (it) { return it.top; }).concat(items.filter(function (it) { return !it.top; }));
      box.innerHTML = '<div class="grid">' + items.map(card).join("") + "</div>";
    }
  }

  function openAll() {
    var links = visible().map(function (it) { return safeUrl(it.link); }).filter(Boolean);
    links.forEach(function (u) {
      var a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    });
  }

  function modal(html) {
    var m = document.getElementById("modal");
    m.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">' + html + "</div></div>";
    var bg = m.firstChild;
    bg.addEventListener("click", function (e) { if (e.target === bg || e.target.closest("[data-close]")) close(); });
    document.addEventListener("keydown", onKey);
    var f = bg.querySelector("input, textarea, select, button"); if (f) f.focus();
    return bg;
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  function close() { document.getElementById("modal").innerHTML = ""; document.removeEventListener("keydown", onKey); }

  function confirmBox(text, label, yes) {
    var bg = modal('<h2>Please confirm</h2><div class="mbody"><p style="margin:0">' + esc(text) + '</p><div class="mfoot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="yes">' + esc(label) + "</button></div></div>");
    bg.querySelector("#yes").addEventListener("click", function () { close(); yes(); });
  }

  function listForm(l) {
    var bg = modal("<h2>" + (l ? "Rename list" : "New list") + '</h2><form id="lf"><div class="field"><label for="lname">List name</label><input id="lname" required maxlength="60" value="' + esc(l ? l.name : "") + '" placeholder="Birthday"></div><div class="mfoot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>');
    bg.querySelector("#lf").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = bg.querySelector("#lname").value.trim(); if (!name) return;
      if (l) l.name = name; else { var n = { id: uid(), name: name, items: [], next: 1 }; state.lists.push(n); ui.list = n.id; ui.cat = "all"; }
      close(); save(); render();
    });
  }

  function deleteList() {
    if (state.lists.length < 2) return;
    var l = cur();
    confirmBox("Delete the list “" + l.name + "” and its " + l.items.length + " items?", "Delete list", function () {
      state.lists = state.lists.filter(function (x) { return x.id !== l.id; }); ui.list = state.lists[0].id; ui.cat = "all"; save(); render();
    });
  }

  function itemForm(it) {
    var l = cur(), cats = categories(l).map(function (c) { return c.name; });
    var upload = assets ? '<div class="field"><label for="fphoto">Or upload a photo</label><input id="fphoto" type="file" accept="image/*"><small>Save the picture from the store page, then choose it here.</small></div>' : "";
    var bg = modal("<h2>" + (it ? "Edit item" : "Add item") + '</h2><form id="itf" novalidate>' +
      '<div class="field"><label for="fname">Item name</label><input id="fname" required maxlength="140" value="' + esc(it ? it.name : "") + '"></div>' +
      '<div class="field"><label for="flink">Link</label><input id="flink" type="url" placeholder="https://" value="' + esc(it ? it.link : "") + '"></div>' +
      '<div class="field"><label for="fprice">Price</label><input id="fprice" inputmode="decimal" placeholder="49.99" value="' + esc(it ? it.price : "") + '"></div>' +
      '<div class="field"><label for="fimg">Image URL</label><input id="fimg" type="url" placeholder="https://" value="' + esc(it && !/^\/_blob\//.test(it.image || "") ? it.image : "") + '"><small>Pictures linked from other websites may not appear on this page. Uploading a photo always works.</small></div>' +
      upload +
      '<div class="field"><label for="fcat">Category</label><input id="fcat" list="catlist" maxlength="60" value="' + esc(it ? it.category : (ui.cat !== "all" ? ui.cat : "")) + '"><datalist id="catlist">' + cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist></div>" +
      '<div class="field"><label for="fnote">Note (optional)</label><textarea id="fnote" rows="2" maxlength="300">' + esc(it ? it.note : "") + "</textarea></div>" +
      '<label class="check" for="fmulti"><input id="fmulti" type="checkbox"' + (it && it.multi ? " checked" : "") + "> Happy to have more than one</label>" +
      '<label class="check" for="ftop"><input id="ftop" type="checkbox"' + (it && it.top ? " checked" : "") + "> Show in Top picks</label>" +
      '<div class="err" id="ferr" role="alert"></div>' +
      '<div class="mfoot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" id="fsave">Save item</button></div></form>');
    var uploaded = it && /^\/_blob\//.test(it.image || "") ? it.image : "";
    var fp = bg.querySelector("#fphoto");
    if (fp) fp.addEventListener("change", function () {
      var file = fp.files[0]; if (!file) return;
      var err = bg.querySelector("#ferr"), btn = bg.querySelector("#fsave");
      err.textContent = "Uploading photo…"; btn.disabled = true;
      assets.upload(file).then(function (r) { uploaded = "/_blob/" + r.id; err.textContent = "Photo added."; })
        .catch(function () { err.textContent = "The photo didn't upload. Try a smaller JPG or PNG."; })
        .then(function () { btn.disabled = false; });
    });
    bg.querySelector("#itf").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = bg.querySelector("#fname").value.trim();
      var link = bg.querySelector("#flink").value.trim();
      var err = bg.querySelector("#ferr");
      if (!name) { err.textContent = "Add the item's name."; bg.querySelector("#fname").focus(); return; }
      if (link && !safeUrl(link)) { err.textContent = "The link needs to start with https://"; bg.querySelector("#flink").focus(); return; }
      var img = bg.querySelector("#fimg").value.trim();
      var data = {
        name: name, link: link, price: bg.querySelector("#fprice").value.trim().replace(/^\$/, ""),
        image: uploaded || img, category: bg.querySelector("#fcat").value.trim() || "Other",
        note: bg.querySelector("#fnote").value.trim(), multi: bg.querySelector("#fmulti").checked, top: bg.querySelector("#ftop").checked
      };
      var dupe = null;
      state.lists.forEach(function (ol) { ol.items.forEach(function (x) {
        if (x === it) return;
        if (x.name.toLowerCase() === data.name.toLowerCase() || (data.link && x.link === data.link)) dupe = dupe || ol.name;
      }); });
      if (dupe && !bg.dataset.ok) { bg.dataset.ok = "1"; err.textContent = "This item is already on \u201c" + dupe + "\u201d. Press Save item again to add it anyway."; return; }
      if (it) Object.assign(it, data);
      else { data.id = uid(); data.added = l.next || (l.items.length + 1); l.next = data.added + 1; l.items.push(data); }
      close(); save(); render();
    });
  }

  function settingsBox() {
    var bg = modal('<h2>Settings</h2><div class="mbody"><label class="check" for="darkchk"><input id="darkchk" type="checkbox"' + (dark ? " checked" : "") + '> Dark mode</label><label class="check" for="devchk"><input id="devchk" type="checkbox"' + (dev ? " checked" : "") + '> Developer options</label><p class="note" style="margin:0">Shows tools for adding, editing and removing items, managing lists, and adding photos. Only changes this browser.</p><div class="mfoot"><button class="btn primary" type="button" data-close>Done</button></div></div>');
    bg.querySelector("#darkchk").addEventListener("change", function (e) {
      dark = e.target.checked; try { localStorage.setItem("gage-wish-dark", dark ? "1" : "0"); } catch (err) {} document.body.classList.toggle("dark", dark);
    });
    bg.querySelector("#devchk").addEventListener("change", function (e) {
      dev = e.target.checked; try { localStorage.setItem("gage-wish-dev", dev ? "1" : "0"); } catch (err) {} render();
    });
  }
  function toBlob(dataUrl) {
    var parts = dataUrl.split(","), mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "image/jpeg";
    var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function importPhotos() {
    if (!assets) return;
    var bg = modal('<h2>Import photos</h2><div class="mbody"><p style="margin:0">Copy the photo data, then press Ctrl+V (or Cmd+V) here.</p><p class="err" id="imsg" role="status"></p><div class="mfoot"><button class="btn" type="button" data-close>Close</button></div></div>');
    var msg = bg.querySelector("#imsg"), busy = false;
    function onMsg(e) {
      if (busy || !document.getElementById("imsg") || !e.data || typeof e.data.gagePhotos !== "object") return;
      run(e.data.gagePhotos);
    }
    window.addEventListener("message", onMsg);
    function onPaste(e) {
      if (busy) return;
      var text = e.clipboardData && e.clipboardData.getData("text");
      var map; try { map = JSON.parse(text); } catch (err) { msg.textContent = "That doesn't look like photo data. Copy it again and paste here."; return; }
      e.preventDefault();
      run(map);
    }
    function run(map) {
      var todo = [];
      state.lists.forEach(function (l) { l.items.forEach(function (it) {
        var d = map[it.name.toLowerCase()];
        if (d && !it.image && /^data:image\//.test(d)) todo.push([it, d]);
      }); });
      if (!todo.length) { msg.textContent = "No new photos matched items on this page."; return; }
      busy = true; var done = 0, failed = 0;
      (function next() {
        if (!todo.length) {
          busy = false; document.removeEventListener("paste", onPaste); window.removeEventListener("message", onMsg);
          msg.textContent = "Added " + done + " photos" + (failed ? " (" + failed + " didn't upload)" : "") + ". Saving\u2026";
          render(); save(); return;
        }
        var job = todo.shift();
        msg.textContent = "Adding photos: " + done + " done, " + todo.length + " to go\u2026";
        assets.upload(toBlob(job[1])).then(function (r) { job[0].image = "/_blob/" + r.id; done++; })
          .catch(function () { failed++; }).then(next);
      })();
    }
    document.addEventListener("paste", onPaste);
  }
  function setPhoto(id, file) {
    if (!assets || !file || !/^image\//.test(file.type)) return;
    var it = null; state.lists.forEach(function (l) { l.items.forEach(function (x) { if (x.id === id) it = x; }); });
    if (!it) return;
    status("Uploading photo\u2026");
    assets.upload(file).then(function (r) { it.image = "/_blob/" + r.id; render(); save(); })
      .catch(function () { status("That photo didn't upload. Try a JPG or PNG."); });
  }
  var picker = document.createElement("input"); picker.type = "file"; picker.accept = "image/*"; picker.hidden = true; picker.id = "picker";
  var pickFor = null;
  picker.addEventListener("change", function () { if (picker.files[0]) setPhoto(pickFor, picker.files[0]); picker.value = ""; });
  function picEvents() {
    var box = document.getElementById("items");
    box.addEventListener("click", function (e) { var p = e.target.closest("[data-pic]"); if (!p) return; pickFor = p.dataset.pic; picker.click(); });
    box.addEventListener("keydown", function (e) { var p = e.target.closest("[data-pic]"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickFor = p.dataset.pic; picker.click(); } });
    box.addEventListener("dragover", function (e) { var p = e.target.closest("[data-pic]"); if (p) { e.preventDefault(); p.classList.add("over"); } });
    box.addEventListener("dragleave", function (e) { var p = e.target.closest("[data-pic]"); if (p) p.classList.remove("over"); });
    box.addEventListener("drop", function (e) { var p = e.target.closest("[data-pic]"); if (!p) return; e.preventDefault(); p.classList.remove("over"); var f = e.dataTransfer.files[0]; if (f) setPhoto(p.dataset.pic, f); });
    document.addEventListener("paste", function (e) {
      var p = document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-pic]");
      var hover = document.querySelector("[data-pic]:hover");
      var target = p || hover; if (!target) return;
      var items = (e.clipboardData && e.clipboardData.files) || [];
      if (items[0]) { e.preventDefault(); setPhoto(target.dataset.pic, items[0]); }
    });
  }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.gageExport) {
      var src = e.source, seen = {}, urls = [];
      state.lists.forEach(function (l) { l.items.forEach(function (x) { if (x.image && /^\/_blob\//.test(x.image) && !seen[x.image]) { seen[x.image] = 1; urls.push(x.image); } }); });
      var out = {}, i = 0;
      function shrink(u) {
        return fetch(u).then(function (r) { return r.blob(); }).then(function (b) { return createImageBitmap(b); }).then(function (bm) {
          var k = Math.min(1, 300 / Math.max(bm.width, bm.height)), c = document.createElement("canvas");
          c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
          var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bm, 0, 0, c.width, c.height);
          out[u] = c.toDataURL("image/jpeg", 0.8);
        }).catch(function () {});
      }
      function next() { if (i >= urls.length) { src.postMessage({ gageExportDone: true, key: state.key, state: state, images: out }, "*"); return; } shrink(urls[i++]).then(next); }
      next();
      return;
    }
    if (!dev || !assets || !e.data || typeof e.data.gagePhotos !== "object" || document.getElementById("imsg")) return;
    importPhotos(); window.postMessage(e.data, "*");
  });
  shell();
  document.body.appendChild(picker);
  picEvents();
  render();
  status(state.savedAt ? "" : "");
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) { if (a) { art = a; shared = true; if (pendingMerge) { pendingMerge = false; save(); } } }).catch(function () {});
    window.claude.use("assets").then(function (a) { assets = a || null; if (assets) { document.getElementById("importbtn").hidden = false; render(); } }).catch(function () {});
  }
})();
</script></body></html>
